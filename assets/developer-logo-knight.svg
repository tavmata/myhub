             C 36 26 38 20 44 17
             C 47 16 51 16 53 14
             C 54 14 55 17 55 20
             C 60 21 68 26 77 34
             C 80 37 78 41 72 42
             C 66 42 62 44 59 47
             C 58 50 63 56 68 64
             C 73 72 75 78 74 82" 
          stroke-width="3" fill="rgba(99, 102, 241, 0.05)"/>

