      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="url(#knightGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
