<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Identidade Visual | Kich.dev.br</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 30, 49, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --knight-accent: #38bdf8;
      --tome-accent: #a855f7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 3rem 1.5rem;
      min-height: 100vh;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    .nav-back { color: var(--knight-accent); text-decoration: none; font-size: 0.9rem; font-weight: 700; margin-bottom: 2rem; display: inline-block; }
    h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 0.5rem; }
    p.subtitle { color: var(--text-muted); margin-bottom: 3rem; font-size: 1.1rem; }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
    }
    .concept-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .preview-box {
      width: 140px;
      height: 140px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .box-knight { background: rgba(56, 189, 248, 0.08); color: var(--knight-accent); }
    .box-tome { background: rgba(168, 85, 247, 0.08); color: var(--tome-accent); }
    .box-monogram { background: linear-gradient(135deg, #1e293b, #0f172a); color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 2.5rem; font-weight: 800; }

    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="nav-back">&larr; Voltar para Kich.dev.br</a>
    <h1>Identidade Visual</h1>
    <p class="subtitle">Logotipos e varia&ccedil;&otilde;es de emblema dos projetos.</p>

    <div class="grid">
      <!-- Concept 1: Knight -->
      <div class="concept-card">
        <div class="preview-box box-knight">
          <svg width="68" height="68" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2l7 4v6c0 5-3.5 9-7 10-3.5-1-7-5-7-10V6l7-4z"/>
            <path d="M12 8v8"/>
            <path d="M9 11h6"/>
          </svg>
        </div>
        <h3>Emblema do Cavaleiro</h3>
        <p class="tag">developer-logo-knight.svg</p>
      </div>

      <!-- Concept 2: Tome -->
      <div class="concept-card">
        <div class="preview-box box-tome">
          <svg width="68" height="68" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            <circle cx="13" cy="11" r="3"/>
          </svg>
        </div>
        <h3>Emblema do Grim&oacute;rio</h3>
        <p class="tag">developer-logo-tome.svg</p>
      </div>

      <!-- Concept 3: Monogram -->
      <div class="concept-card">
        <div class="preview-box box-monogram">
          <span style="background: linear-gradient(90deg, #38bdf8, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">MH</span>
        </div>
        <h3>Monograma</h3>
        <p class="tag">developer-monogram-concept.jpg</p>
      </div>
    </div>
  </div>
</body>
</html>
